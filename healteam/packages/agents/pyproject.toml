[project]
name = "healteam-agents"
version = "0.1.0"
description = "HealTeam AI agents and LangGraph orchestrator"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "healteam-memory==0.1.0",
    "pydantic>=2.10,<3",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
]

[tool.setuptools]
packages = ["healteam_agents"]

[tool.setuptools.package-dir]
healteam_agents = "."

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
