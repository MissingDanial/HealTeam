[tool.poetry]
name = "healteam-agents"
version = "0.1.0"
description = "HealTeam AI agents and LangGraph orchestrator"
authors = ["HealTeam <dev@healteam.local>"]
license = "Proprietary"
packages = [{include = "."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
pydantic = ">=2.6,<3.0"
langgraph = ">=0.2,<1.0"
langchain-core = ">=0.3,<1.0"

healteam-memory = {path = "../memory", develop = true}

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
