[project]
name = "healteam-api"
version = "0.1.0"
description = "HealTeam — Family Therapy AI Simulator (FastAPI backend)"
requires-python = ">=3.11,<3.13"
license = "MIT"
readme = "README.md"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.18,<1",
    "httpx>=0.28,<0.29",
    "anthropic>=0.40,<1",
    "langgraph>=0.2,<1",
    "langchain-core>=0.3,<1",
    "sqlalchemy[asyncio]>=2.0.38,<2.1",
    "aiosqlite>=0.21,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
]

# The runnable monorepo distribution is defined at ../../pyproject.toml.
# This metadata builds only the API package, without files outside its root.
[tool.setuptools]
packages = ["app", "app.routers", "app.services"]

[tool.setuptools.package-dir]
app = "app"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
