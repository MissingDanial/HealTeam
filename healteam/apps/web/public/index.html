<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HealTeam - 家庭治疗 AI 模拟系统</title>
<style>
:root {
  --doctor: #4a7fb5;
  --father: #5a9e7c;
  --mother: #8e7ab5;
  --patient: #c49a4e;
  --observer: #7a8594;
  --psychiatrist: #6b8fa3;
  --bg: #f0f1f3;
  --card: #ffffff;
  --border: #d5d8de;
  --text: #2c3340;
  --text-muted: #6b7280;
  --text-light: #9ca3af;
  --header-bg: #2c3340;
  --header-text: #e5e7eb;
  --accent: #4a7fb5;
  --radius: 6px;
  --shadow: 0 1px 3px rgba(0,0,0,0.06);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.5;
}

/* ---- Layout ---- */
.app {
  display: grid;
  grid-template-columns: 260px 1fr 280px;
  grid-template-rows: 48px 1fr;
  height: 100vh;
}
.header {
  grid-column: 1 / -1;
  background: var(--header-bg);
  color: var(--header-text);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.header h1 {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: #ffffff;
}
.header .divider {
  width: 1px;
  height: 18px;
  background: rgba(255,255,255,0.15);
}
.header .subtitle {
  font-size: 12px;
  color: #9ca3af;
  font-weight: 400;
}
.header .version {
  margin-left: auto;
  font-size: 11px;
  color: #6b7280;
  font-family: "SF Mono", "Consolas", monospace;
}

/* ---- Shared Panel ---- */
.left-panel, .right-panel {
  background: var(--card);
  overflow-y: auto;
  padding: 14px 16px;
}
.left-panel {
  border-right: 1px solid var(--border);
}
.right-panel {
  border-left: 1px solid var(--border);
}

.panel-section { margin-bottom: 18px; }
.panel-section h3 {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* ---- Case Info ---- */
.case-info { font-size: 13px; line-height: 1.6; }
.case-info .title {
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
  font-size: 14px;
}
.case-info .problem {
  color: var(--text-muted);
  font-size: 12px;
  line-height: 1.5;
}

.family-member {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid #f0f1f3;
  font-size: 12px;
}
.family-member:last-child { border-bottom: none; }
.member-dot {
  width: 8px;
  height: 8px;
  border-radius: 2px;
  flex-shrink: 0;
}
.member-name { font-weight: 600; font-size: 13px; }
.member-role { color: var(--text-muted); font-size: 11px; }

/* ---- Controls ---- */
.control-group { margin-bottom: 12px; }
.control-group label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 4px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.control-group select, .control-group input {
  width: 100%;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  background: #fafbfc;
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.control-group select:focus, .control-group input:focus {
  border-color: var(--accent);
}
.btn-start {
  width: 100%;
  padding: 10px;
  background: var(--header-bg);
  color: #ffffff;
  border: none;
  border-radius: var(--radius);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
  letter-spacing: 0.3px;
  margin-top: 4px;
}
.btn-start:hover { background: #3d4555; }
.btn-start:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

/* ---- Main Chat ---- */
.main-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
  scroll-behavior: smooth;
}
.chat-welcome {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.chat-welcome h2 {
  font-size: 16px;
  margin-bottom: 8px;
  color: var(--text);
  font-weight: 600;
}
.chat-welcome p {
  font-size: 13px;
  color: var(--text-light);
}

/* ---- Chat Bubbles ---- */
.bubble {
  display: flex;
  gap: 10px;
  margin-bottom: 14px;
  animation: fadeIn 0.35s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.bubble-avatar {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: white;
  flex-shrink: 0;
}
.bubble-body { max-width: 78%; }
.bubble-name {
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 3px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.bubble-name .bubble-round-tag {
  font-size: 10px;
  color: var(--text-light);
  font-weight: 400;
}
.bubble-content {
  padding: 10px 14px;
  border-radius: var(--radius);
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-word;
  background: #fafbfc;
  border: 1px solid var(--border);
}
.bubble.round-break {
  justify-content: center;
  margin: 16px 0 12px;
}
.round-divider {
  font-size: 11px;
  color: var(--text-light);
  background: var(--border);
  padding: 3px 14px;
  border-radius: 10px;
  font-weight: 500;
}

/* Hint bubble in chat */
.bubble.hint .bubble-content {
  background: #faf8f5;
  border: 1px solid #e8ddd0;
  font-size: 12px;
  color: #7a6b52;
}
.bubble.hint .bubble-avatar {
  background: var(--observer);
  font-size: 10px;
}
.bubble.hint .bubble-name {
  color: var(--observer);
}

/* Supervision / Report */
.section-block {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.section-block h3 {
  font-size: 14px;
  font-weight: 600;
  margin-bottom: 12px;
  color: var(--text);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.section-block h4 {
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-block h4::before {
  content: '';
  display: inline-block;
  width: 3px;
  height: 14px;
  border-radius: 2px;
  flex-shrink: 0;
}
.section-block h4.color-doctor::before { background: var(--doctor); }
.section-block h4.color-observer::before { background: var(--observer); }
.section-block h4.color-psychiatrist::before { background: var(--psychiatrist); }
.section-block h4.color-father::before { background: var(--father); }
.section-block pre {
  font-size: 12px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: var(--text-muted);
  background: #fafbfc;
  padding: 10px 12px;
  border-radius: var(--radius);
  border: 1px solid #f0f1f3;
  margin-bottom: 12px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
}

/* ---- Stats ---- */
.stat-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-size: 12px;
}
.stat-bar .label {
  width: 36px;
  font-weight: 600;
  font-size: 11px;
}
.stat-bar .bar {
  flex: 1;
  height: 14px;
  background: #f0f1f3;
  border-radius: 3px;
  overflow: hidden;
}
.stat-bar .bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s ease;
  min-width: 2px;
  opacity: 0.75;
}
.stat-bar .count {
  width: 22px;
  text-align: right;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

/* ---- Hint list (right panel) ---- */
.hint-item {
  padding: 8px 10px;
  background: #faf8f5;
  border-left: 2px solid #c49a4e;
  border-radius: 0 var(--radius) var(--radius) 0;
  margin-bottom: 6px;
  font-size: 11px;
  line-height: 1.5;
  animation: fadeIn 0.35s ease;
}
.hint-item .hint-trigger {
  font-weight: 600;
  color: #7a6b52;
  font-size: 10px;
  margin-bottom: 2px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.hint-item .hint-round {
  color: var(--text-light);
  font-size: 10px;
}

/* ---- Status ---- */
.status-info {
  font-size: 12px;
  line-height: 2;
}
.status-info .label { color: var(--text-muted); }
.status-info .value {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.status-dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
.status-dot.ready { background: #9ca3af; }
.status-dot.running { background: #5a9e7c; animation: pulse 1.5s ease infinite; }
.status-dot.done { background: var(--doctor); }
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

/* Loading */
.spinner {
  display: inline-block;
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255,255,255,0.3);
  border-top-color: #ffffff;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  margin-right: 6px;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Scrollbar */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d5d8de; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #b0b5be; }

/* System message */
.system-msg {
  text-align: center;
  padding: 8px 12px;
  font-size: 12px;
  color: var(--text-light);
  margin: 8px 0;
}
.system-msg.error { color: #b45c5c; }
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <div class="header">
    <h1>HealTeam</h1>
    <div class="divider"></div>
    <span class="subtitle">家庭治疗 AI 模拟系统</span>
    <span class="version">v0.1.0</span>
  </div>

  <!-- Left Panel -->
  <div class="left-panel">
    <div class="panel-section">
      <h3>控制面板</h3>
      <div class="control-group">
        <label>案例</label>
        <select id="caseSelect">
          <option value="teen-truancy-01">高一男生拒学三个月</option>
        </select>
      </div>
      <div class="control-group">
        <label>治疗学派</label>
        <select id="schoolSelect">
          <option value="structural">结构式家庭治疗 (Minuchin)</option>
          <option value="bowen">Bowen 系统治疗</option>
          <option value="satir">Satir 转化式系统治疗</option>
        </select>
      </div>
      <div class="control-group">
        <label>最大轮次</label>
        <input type="number" id="roundsInput" value="10" min="1" max="30">
      </div>
      <button class="btn-start" id="btnStart" onclick="startSession()">开始模拟</button>
    </div>

    <div class="panel-section" id="caseInfoSection" style="display:none">
      <h3>案例信息</h3>
      <div class="case-info">
        <div class="title" id="caseTitle"></div>
        <div class="problem" id="caseProblem"></div>
      </div>
    </div>

    <div class="panel-section" id="familySection" style="display:none">
      <h3>家庭成员</h3>
      <div id="familyList"></div>
    </div>

    <div class="panel-section" id="defenseSection" style="display:none">
      <h3>防御机制</h3>
      <div id="defenseList" style="font-size:12px; line-height:1.8; color:var(--text-muted);"></div>
    </div>
  </div>

  <!-- Main Chat -->
  <div class="main-panel">
    <div class="chat-area" id="chatArea">
      <div class="chat-welcome" id="chatWelcome">
        <h2>家庭治疗 AI 模拟</h2>
        <p>选择案例和学派，点击「开始模拟」观看 AI 治疗对话</p>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="right-panel">
    <div class="panel-section">
      <h3>会话状态</h3>
      <div class="status-info">
        <div><span class="label">轮次 </span><span class="value" id="statRound">—</span></div>
        <div><span class="label">事件 </span><span class="value" id="statEvents">—</span></div>
        <div>
          <span class="label">状态 </span>
          <span class="value" id="statStatus">
            <span class="status-dot ready"></span>就绪
          </span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h3>发言统计</h3>
      <div id="statsArea">
        <div class="stat-bar">
          <span class="label" style="color:var(--doctor)">医生</span>
          <div class="bar"><div class="bar-fill" id="barDoctor" style="background:var(--doctor);width:0"></div></div>
          <span class="count" id="countDoctor">0</span>
        </div>
        <div class="stat-bar">
          <span class="label" style="color:var(--father)">父亲</span>
          <div class="bar"><div class="bar-fill" id="barFather" style="background:var(--father);width:0"></div></div>
          <span class="count" id="countFather">0</span>
        </div>
        <div class="stat-bar">
          <span class="label" style="color:var(--mother)">母亲</span>
          <div class="bar"><div class="bar-fill" id="barMother" style="background:var(--mother);width:0"></div></div>
          <span class="count" id="countMother">0</span>
        </div>
        <div class="stat-bar">
          <span class="label" style="color:var(--patient)">病人</span>
          <div class="bar"><div class="bar-fill" id="barPatient" style="background:var(--patient);width:0"></div></div>
          <span class="count" id="countPatient">0</span>
        </div>
      </div>
    </div>

    <div class="panel-section">
      <h3>旁观者提示</h3>
      <div id="hintsArea" style="font-size:11px; color:var(--text-light);">
        暂无提示
      </div>
    </div>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const ACTOR_CONFIG = {
  doctor:    { label: '主治医师', color: '#4a7fb5', initial: '医' },
  father:    { label: '父亲',     color: '#5a9e7c', initial: '父' },
  mother:    { label: '母亲',     color: '#8e7ab5', initial: '母' },
  patient:   { label: '病人',     color: '#c49a4e', initial: '患' },
  observer:  { label: '旁观者',   color: '#7a8594', initial: '观' },
  psychiatrist: { label: '心理医生', color: '#6b8fa3', initial: '心' },
};

let currentRound = -1;
let eventCount = 0;
let actorCounts = { doctor: 0, father: 0, mother: 0, patient: 0, observer: 0 };
let isRunning = false;

// ---- Load cases ----
async function loadCases() {
  try {
    const res = await fetch(`${API_BASE}/api/v1/cases`);
    if (!res.ok) return;
    const cases = await res.json();
    const sel = document.getElementById('caseSelect');
    sel.innerHTML = '';
    cases.forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.case_id;
      opt.textContent = c.title || c.case_id;
      sel.appendChild(opt);
    });
    if (cases.length > 0) loadCaseDetail(cases[0].case_id);
  } catch (e) { console.warn('Failed to load cases:', e); }
}

async function loadCaseDetail(caseId) {
  try {
    const res = await fetch(`${API_BASE}/api/v1/cases/${caseId}`);
    if (!res.ok) return;
    const data = await res.json();

    document.getElementById('caseTitle').textContent = data.title;
    document.getElementById('caseProblem').textContent = data.presenting_problem;
    document.getElementById('caseInfoSection').style.display = '';

    // Family members.
    const familyDiv = document.getElementById('familyList');
    familyDiv.innerHTML = '';
    const members = [
      { key: 'father', label: '父亲', color: 'var(--father)' },
      { key: 'mother', label: '母亲', color: 'var(--mother)' },
      { key: 'patient', label: '病人', color: 'var(--patient)' },
    ];
    members.forEach(m => {
      const info = data.family[m.key] || {};
      const div = document.createElement('div');
      div.className = 'family-member';
      div.innerHTML = `
        <div class="member-dot" style="background:${m.color}"></div>
        <div>
          <div class="member-name">${info.name || m.label}</div>
          <div class="member-role">${info.age ? info.age + '岁' : ''} ${info.trait || ''}</div>
        </div>`;
      familyDiv.appendChild(div);
    });
    document.getElementById('familySection').style.display = '';

    // Defense mechanisms.
    const defDiv = document.getElementById('defenseList');
    defDiv.innerHTML = '';
    members.forEach(m => {
      const patterns = data.defense_patterns[m.key] || [];
      if (patterns.length > 0) {
        const p = patterns[0];
        defDiv.innerHTML += `<div style="margin-bottom:6px"><strong style="color:${m.color}">${m.label}:</strong> ${p.name || ''}</div>`;
      }
    });
    document.getElementById('defenseSection').style.display = '';

  } catch (e) { console.warn('Failed to load case detail:', e); }
}

document.getElementById('caseSelect').addEventListener('change', (e) => {
  loadCaseDetail(e.target.value);
});

// ---- Start session ----
async function startSession() {
  if (isRunning) return;
  isRunning = true;

  const btn = document.getElementById('btnStart');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>运行中...';

  // Reset state.
  currentRound = -1;
  eventCount = 0;
  actorCounts = { doctor: 0, father: 0, mother: 0, patient: 0, observer: 0 };
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('hintsArea').innerHTML = '<span style="color:var(--text-light)">监听中...</span>';
  document.getElementById('statStatus').innerHTML = '<span class="status-dot running"></span>运行中';
  updateStats();

  const caseId = document.getElementById('caseSelect').value;
  const school = document.getElementById('schoolSelect').value;
  const maxRounds = parseInt(document.getElementById('roundsInput').value) || 10;

  try {
    const res = await fetch(`${API_BASE}/api/v1/sessions`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ case_id: caseId, school, max_rounds: maxRounds }),
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      let eventType = '';
      let eventData = '';

      for (const line of lines) {
        if (line.startsWith('event: ')) {
          eventType = line.slice(7).trim();
        } else if (line.startsWith('data: ')) {
          eventData = line.slice(6);
        } else if (line === '' && eventType && eventData) {
          handleEvent(eventType, JSON.parse(eventData));
          eventType = '';
          eventData = '';
        }
      }
    }
  } catch (e) {
    console.error('Session error:', e);
    addSystemMessage('连接错误: ' + e.message, true);
  } finally {
    isRunning = false;
    btn.disabled = false;
    btn.textContent = '开始模拟';
    document.getElementById('statStatus').innerHTML = '<span class="status-dot done"></span>已结束';
  }
}

// ---- Handle SSE events ----
function handleEvent(type, data) {
  switch (type) {
    case 'start':
      document.getElementById('statRound').textContent = `0 / ${data.max_rounds}`;
      break;

    case 'utterance':
      addBubble(data.round, data.actor, data.content);
      eventCount++;
      if (actorCounts[data.actor] !== undefined) actorCounts[data.actor]++;
      document.getElementById('statEvents').textContent = eventCount;
      document.getElementById('statRound').textContent = `${data.round} / ${document.getElementById('roundsInput').value}`;
      updateStats();
      break;

    case 'hint':
      addHintBubble(data.round, data.trigger, data.content, data.confidence);
      eventCount++;
      actorCounts.observer++;
      document.getElementById('statEvents').textContent = eventCount;
      addHintItem(data.round, data.trigger, data.content);
      updateStats();
      break;

    case 'session_end':
      document.getElementById('statStatus').innerHTML = '<span class="status-dot done"></span>已完成';
      document.getElementById('statRound').textContent = `${data.rounds} 轮`;
      document.getElementById('statEvents').textContent = data.total_events;
      break;

    case 'supervision':
      addSupervisionSection(data);
      break;

    case 'report':
      addReportSection(data.content);
      break;

    case 'error':
      addSystemMessage('错误: ' + (data.message || '未知错误'), true);
      break;

    case 'complete':
      break;
  }
}

// ---- Render functions ----
function addBubble(round, actor, content) {
  const chatArea = document.getElementById('chatArea');
  const welcome = document.getElementById('chatWelcome');
  if (welcome) welcome.remove();

  // Round divider.
  if (round !== currentRound) {
    currentRound = round;
    const divider = document.createElement('div');
    divider.className = 'bubble round-break';
    divider.innerHTML = `<span class="round-divider">第 ${round} 轮</span>`;
    chatArea.appendChild(divider);
  }

  const config = ACTOR_CONFIG[actor] || { label: actor, color: '#7a8594', initial: actor[0] };

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = `
    <div class="bubble-avatar" style="background:${config.color}">${config.initial}</div>
    <div class="bubble-body">
      <div class="bubble-name" style="color:${config.color}">${config.label}</div>
      <div class="bubble-content">${escapeHtml(content)}</div>
    </div>`;
  chatArea.appendChild(bubble);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addHintBubble(round, trigger, content, confidence) {
  const chatArea = document.getElementById('chatArea');

  const bubble = document.createElement('div');
  bubble.className = 'bubble hint';
  bubble.innerHTML = `
    <div class="bubble-avatar">观</div>
    <div class="bubble-body">
      <div class="bubble-name">旁观者 · ${trigger}</div>
      <div class="bubble-content">${escapeHtml(content)}</div>
    </div>`;
  chatArea.appendChild(bubble);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addHintItem(round, trigger, content) {
  const hintsArea = document.getElementById('hintsArea');
  if (hintsArea.textContent === '暂无提示' || hintsArea.textContent === '监听中...') {
    hintsArea.innerHTML = '';
  }
  const item = document.createElement('div');
  item.className = 'hint-item';
  item.innerHTML = `
    <div class="hint-trigger">R${round} · ${trigger}</div>
    <div>${escapeHtml(content)}</div>`;
  hintsArea.prepend(item);
}

function addSupervisionSection(data) {
  const chatArea = document.getElementById('chatArea');

  const section = document.createElement('div');
  section.className = 'section-block';
  section.style.marginTop = '20px';
  section.innerHTML = `
    <h3>督导会议</h3>
    <div style="margin-bottom:12px">
      <h4 class="color-doctor" style="color:var(--doctor)">医生反思</h4>
      <pre>${escapeHtml(data.doctor_reflection)}</pre>
    </div>
    <div style="margin-bottom:12px">
      <h4 class="color-observer" style="color:var(--observer)">观察者报告</h4>
      <pre>${escapeHtml(data.observer_report)}</pre>
    </div>
    <div style="margin-bottom:12px">
      <h4 class="color-psychiatrist" style="color:var(--psychiatrist)">心理医生分析</h4>
      <pre>${escapeHtml(data.psychiatrist_analysis)}</pre>
    </div>
    <div>
      <h4 class="color-father" style="color:var(--father)">督导共识</h4>
      <pre>${escapeHtml(data.consensus)}</pre>
    </div>`;
  chatArea.appendChild(section);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addReportSection(content) {
  const chatArea = document.getElementById('chatArea');

  const section = document.createElement('div');
  section.className = 'section-block';
  section.innerHTML = `
    <h3>评估报告</h3>
    <pre style="max-height:500px; overflow-y:auto">${escapeHtml(content)}</pre>`;
  chatArea.appendChild(section);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function addSystemMessage(msg, isError) {
  const chatArea = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'system-msg' + (isError ? ' error' : '');
  div.textContent = msg;
  chatArea.appendChild(div);
}

function updateStats() {
  const max = Math.max(1, ...Object.values(actorCounts));
  for (const [actor, count] of Object.entries(actorCounts)) {
    const barEl = document.getElementById(`bar${actor.charAt(0).toUpperCase() + actor.slice(1)}`);
    const countEl = document.getElementById(`count${actor.charAt(0).toUpperCase() + actor.slice(1)}`);
    if (barEl) barEl.style.width = `${(count / max) * 100}%`;
    if (countEl) countEl.textContent = count;
  }
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ---- Init ----
loadCases();
</script>
